[workspace]
resolver = "3"
members = ["crates/jc"]
# Build experiments with heavy native dependencies live in their own
# workspaces so they never slow down a normal build.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
