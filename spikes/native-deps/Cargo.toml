# Build check for the native side of the analysis stages: does whisper.cpp
# (whisper-rs) build, link and run on every OS we ship for, and does `tract`
# run the YuNet face model there? Kept out of the jc workspace so a normal
# `cargo build` never pays for compiling whisper.cpp.
#
# `tract` was picked over `ort` (ONNX Runtime), which has no prebuilt
# binaries for Intel macOS.
[package]
name = "native-deps-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
whisper-rs = "0.16"
tract-onnx = "0.23"

[features]
metal = ["whisper-rs/metal"]
