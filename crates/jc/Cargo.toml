[package]
name = "jc"
description = "just-clipping: turn long videos and livestreams into short vertical clips"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "jc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
indicatif = "0.18"
jiff = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
whisper-rs = "0.16"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Metal is always there on Apple Silicon.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[features]
# GPU transcription backends, for release builds on machines that have them.
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
