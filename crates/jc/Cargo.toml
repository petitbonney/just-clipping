[package]
name = "jc"
description = "just-clipping: turn long videos and livestreams into short vertical clips"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "jc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
indicatif = "0.18"
jiff = { version = "1", features = ["serde"] }
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
