name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    # Every push runs CI, so a pull request only needs its own run when it
    # comes from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked

  # Installs the real tools on every platform jc ships for, then renders a
  # captioned, loudness-normalized vertical clip with the managed ffmpeg.
  doctor:
    name: doctor (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel covers Intel Macs.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner context is not allowed in job-level env, so set the paths
      # here. `pwd -W` (Git Bash on Windows) gives D:/a/_temp, a form both
      # bash and Windows programs accept.
      - name: set jc folders
        run: |
          tmp="$(cd "$RUNNER_TEMP" && (pwd -W 2>/dev/null || pwd))"
          echo "JC_WORKSPACE=$tmp/jc-workspace" >> "$GITHUB_ENV"
          echo "JC_CACHE_DIR=$tmp/jc-cache" >> "$GITHUB_ENV"
      - name: build
        run: cargo build --locked
      # jc's own ffmpeg build, and the small whisper model to keep CI fast.
      - name: configure jc
        run: |
          mkdir -p "$JC_WORKSPACE"
          printf '[tools]\nprefer_system_ffmpeg = false\n\n[models]\nwhisper = "tiny"\n' > "$JC_WORKSPACE/config.toml"
      - name: jc doctor (install)
        run: target/debug/jc doctor
      - name: jc doctor (second run is a no-op)
        run: |
          target/debug/jc doctor --json > doctor.json
          cat doctor.json
          grep -q '"ok": true' doctor.json
          if grep -q '"status": "installed"' doctor.json; then
            echo "the second doctor run reinstalled a tool"; exit 1
          fi
      - name: render a captioned vertical clip
        working-directory: ${{ runner.temp }}
        run: |
          bin="$JC_CACHE_DIR/bin"
          printf '%s\n' \
            '[Script Info]' 'ScriptType: v4.00+' 'PlayResX: 1080' 'PlayResY: 1920' \
            '[V4+ Styles]' \
            'Format: Name, Fontname, Fontsize, PrimaryColour, OutlineColour, BorderStyle, Outline, Alignment' \
            'Style: Default,Arial,90,&H00FFFFFF,&H00000000,1,6,2' \
            '[Events]' 'Format: Layer, Start, End, Style, Text' \
            'Dialogue: 0,0:00:00.00,0:00:02.00,Default,Bonjour à tous !' > t.ass
          "$bin/ffmpeg" -hide_banner -y \
            -f lavfi -i color=c=blue:s=1080x1920:d=2 -f lavfi -i sine=f=440:d=2 \
            -vf ass=t.ass -af loudnorm=I=-14 -c:v libx264 -c:a aac -shortest out.mp4
          "$bin/ffprobe" -v error -show_entries stream=codec_name,width,height -of csv=p=0 out.mp4 | tee streams.txt
          grep -q 'h264,1080,1920' streams.txt
          grep -q 'aac' streams.txt
      # Spoken English from the OS's own voice, a test pattern, and a chat
      # burst: ingest and analyze must find all of it.
      - name: ingest and analyze a test video
        working-directory: ${{ runner.temp }}
        run: |
          bin="$JC_CACHE_DIR/bin"
          jc="$GITHUB_WORKSPACE/target/debug/jc"
          if [ "$RUNNER_OS" = Windows ]; then py=python; else py=python3; fi
          text="Hello everyone and welcome back to the stream. Today we fight the final boss. Watch out, here it comes. Oh no, I died. That was incredible."
          speech=""
          case "$RUNNER_OS" in
            macOS) say -o speech.aiff "$text" && speech=speech.aiff ;;
            Linux) sudo apt-get install -y -qq espeak-ng > /dev/null && espeak-ng -w speech.wav "$text" && speech=speech.wav ;;
            Windows) powershell -NoProfile -Command "Add-Type -AssemblyName System.Speech; \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer; \$s.SetOutputToWaveFile('speech.wav'); \$s.Speak('$text'); \$s.Dispose()" && speech=speech.wav ;;
          esac
          if [ -n "$speech" ]; then
            audio=(-i "$speech"); filter="[1:a]apad=whole_dur=30[a]"
          else
            echo "no system voice; testing without speech"
            audio=(-f lavfi -i "sine=f=300:d=30"); filter="[1:a]anull[a]"
          fi
          "$bin/ffmpeg" -hide_banner -loglevel error -y -f lavfi -i "testsrc2=s=1280x720:r=30:d=30" "${audio[@]}" \
            -filter_complex "$filter" -map 0:v -map "[a]" -c:v libx264 -preset veryfast -c:a aac -t 30 e2e.mp4
          $py - <<'PY'
          import json
          with open("chat.jsonl", "w") as f:
              for t in range(30):
                  for _ in range(15 if 10 <= t < 13 else 1):
                      f.write(json.dumps({"t": t + 0.5, "user": "u", "text": "LUL" if 10 <= t < 13 else "hi"}) + "\n")
          PY
          "$jc" ingest e2e.mp4 --chat chat.jsonl --json > ingest.json
          id=$($py -c 'import json; print(json.load(open("ingest.json"))["project"])')
          "$jc" analyze -p "$id" --json > analyze.json
          cat analyze.json
          SPEECH="$speech" $py - <<'PY'
          import json, os
          a = json.load(open("analyze.json"))
          for s in ["audio", "scenes", "speech", "chat_rate", "chat_hype"]:
              assert s in a["signals"], f"missing signal {s}: {a['signals']}"
          if os.environ["SPEECH"]:
              assert a["words"] > 5, f"expected words, got {a['words']}"
              assert a["language"] == "en", a["language"]
          print("ok:", a["words"], "words,", a["signals"])
          PY
